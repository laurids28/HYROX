<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyrox 01.11.</title>
<meta name="description" content="Trainingsplan Hyrox Single Open, 01.11.2026">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2b3140;
  --tx:#e8ebf1; --tx2:#a8b1c1; --tx3:#767f90;
  --acc:#5aa9ff; --ok:#79d69f; --warn:#f2b65e; --hot:#f4817e;
  --fs:1rem; --tap:46px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f6f8; --card:#fff; --card2:#eef0f4; --line:#dde1e8;
    --tx:#14181e; --tx2:#4b5462; --tx3:#767f90;
    --acc:#0b62c4; --ok:#178054; --warn:#8f5a06; --hot:#c0322f; }
}
html[data-th="dark"]{ color-scheme:dark }
html[data-th="light"]{ color-scheme:light;
  --bg:#f5f6f8; --card:#fff; --card2:#eef0f4; --line:#dde1e8;
  --tx:#14181e; --tx2:#4b5462; --tx3:#767f90;
  --acc:#0b62c4; --ok:#178054; --warn:#8f5a06; --hot:#c0322f; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(66px + var(--sab));overscroll-behavior-y:contain}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.25}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:1.02em;font-weight:700;flex:1;min-width:0}
.hrow h1 span{display:block;font-size:.72em;font-weight:500;color:var(--tx3);letter-spacing:0}
.iconbtn{min-width:var(--tap);min-height:var(--tap);flex:0 0 auto;display:inline-flex;
  align-items:center;justify-content:center;gap:1px;white-space:nowrap;
  border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:.82em;font-weight:700;color:var(--tx2)}
.iconbtn sup{font-size:.72em;line-height:1}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.barlab{display:flex;justify-content:space-between;font-size:.72em;color:var(--tx3);margin-top:5px;
  font-variant-numeric:tabular-nums}

main{padding:16px 16px 24px;max-width:640px;margin:0 auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card.acc{border-left:4px solid var(--acc)}
.card.warn{border-left:4px solid var(--warn)}
.card.hot{border-left:4px solid var(--hot)}
.card.ok{border-left:4px solid var(--ok)}
.ct{font-weight:700;font-size:.95em;margin-bottom:6px}
.sub{color:var(--tx2);font-size:.86em}
.tag{display:inline-block;font-size:.66em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;vertical-align:2px}
.t-run{background:rgba(90,169,255,.16);color:var(--acc)}
.t-str{background:rgba(121,214,159,.16);color:var(--ok)}
.t-hyx{background:rgba(242,182,94,.18);color:var(--warn)}
.t-off{background:rgba(150,160,180,.16);color:var(--tx3)}
.t-tst{background:rgba(244,129,126,.16);color:var(--hot)}

/* Tagesnavigation */
.daynav{display:flex;align-items:stretch;gap:8px;margin:0 0 14px}
.daynav button{flex:0 0 auto;min-width:52px;min-height:var(--tap);border-radius:12px;
  background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:1.2em;font-weight:700}
.daynav button[disabled]{opacity:.35}
.daynav .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:6px 8px;text-align:center}
.daynav .mid b{font-size:.9em;line-height:1.2}
.daynav .mid span{font-size:.7em;color:var(--tx3)}
.daynav .today{min-width:auto;padding:0 12px;font-size:.78em;font-weight:700;color:var(--acc)}

.today .dt{font-size:.78em;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.today h2{font-size:1.5em;margin:6px 0 4px}
.today .meta{font-size:.85em;color:var(--tx2);font-variant-numeric:tabular-nums}
ul.steps{list-style:none;padding:0;margin:14px 0 0}
ul.steps li{position:relative;padding:9px 0 9px 26px;border-bottom:1px solid var(--line);font-size:.92em}
ul.steps li:last-child{border-bottom:none}
ul.steps li::before{content:"";position:absolute;left:6px;top:1.05em;width:7px;height:7px;
  border-radius:50%;background:var(--tx3)}
ul.steps li.arrow{padding-left:26px;color:var(--tx2);font-size:.87em}
ul.steps li.arrow::before{content:"→";background:none;left:4px;top:.55em;width:auto;height:auto;
  color:var(--acc);font-weight:700;font-size:.95em}
.big{width:100%;min-height:54px;border-radius:14px;font-weight:750;font-size:1em;
  display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;
  background:var(--acc);color:#fff;border:1px solid transparent}
.big[aria-pressed="true"]{background:var(--ok);color:#06231a}
html[data-th="dark"] .big[aria-pressed="true"]{color:#04180f}
.big.ghost{background:var(--card2);color:var(--tx);border-color:var(--line)}
a.big{margin-top:10px;text-decoration:none}
.big.coach{background:linear-gradient(135deg,#c96442,#a8502f);color:#fff;border-color:transparent}
.big.sm{min-height:46px;font-size:.9em;margin-top:10px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:.74em;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.f input,.f textarea,.f select{background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:11px;padding:12px;font:inherit;font-size:.92em;min-height:var(--tap);width:100%}
.f textarea{min-height:84px;resize:vertical;font-family:inherit}
.f .hint{font-size:.72em;color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0}
.echo{font-size:.78em;color:var(--tx2);min-height:1.1em;font-variant-numeric:tabular-nums}
.echo b{font-family:var(--mono);color:var(--ok)}
.echo .bad{color:var(--hot)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:var(--tap);border-radius:11px;background:var(--card2);
  border:1px solid var(--line);font-size:.86em;font-weight:650;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}

.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;overflow:hidden}
.wk>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;
  gap:4px 8px;align-items:center;flex-wrap:wrap;min-height:var(--tap)}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary b{flex:0 0 auto;font-size:.95em}
.wk>summary em{flex:1 1 auto;min-width:0;font-style:normal;font-weight:500;color:var(--tx3);font-size:.8em}
.wk>summary .km{flex:0 0 auto;margin-left:auto;font-size:.75em;color:var(--tx2);white-space:nowrap;
  font-variant-numeric:tabular-nums;background:var(--card2);border-radius:99px;padding:3px 9px}
.wbody{border-top:1px solid var(--line);padding:4px 16px 12px}
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;min-height:var(--tap)}
.drow:last-child{border-bottom:none}
.drow .dd{font-size:.72em;color:var(--tx3);font-weight:700;width:34px;flex:0 0 34px;line-height:1.3}
.drow .dd b{display:block;color:var(--tx);font-size:1.15em}
.drow .di{flex:1;min-width:0}
.drow .di .n{display:block;font-weight:650;font-size:.9em;line-height:1.35}
.drow .di .m{display:block;font-size:.76em;color:var(--tx3);line-height:1.35}
.drow .ck{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:.8em;color:transparent}
.drow[data-ck="1"] .ck{background:var(--ok);border-color:var(--ok);color:#04180f}
.drow[data-today="1"]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent);
  margin:0 -16px;padding-left:16px;padding-right:16px}
.drow[data-cur="1"] .di .n{color:var(--acc)}

.tb{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -4px 0}
table{width:100%;border-collapse:collapse;font-size:.84em}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
td.n{font-family:var(--mono);white-space:nowrap;font-size:.95em}
tr:last-child td{border-bottom:none}
td .up{color:var(--ok);font-weight:700}
td .dn{color:var(--hot);font-weight:700}

.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dots span{width:11px;height:11px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.dots span.on{background:var(--ok);border-color:var(--ok)}
.dots span.tdy{outline:2px solid var(--acc);outline-offset:1px}

.ev{margin:0;padding:0;list-style:none;font-size:.87em}
.ev li{padding:10px 0;border-bottom:1px solid var(--line)}
.ev li:last-child{border-bottom:none}
.ev .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .h b{font-weight:650}
.ev .h .d{color:var(--tx3);font-size:.85em;font-variant-numeric:tabular-nums}
.ev .r{color:var(--tx2);font-size:.92em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi2 div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi2 .l{font-size:.68em;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700}
.kpi2 .v{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:.68em;font-weight:700;color:var(--tx3);letter-spacing:.02em}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.85em;
  font-weight:650;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-contrast: more){ :root{--line:#6b7484} .sub,.f label{color:var(--tx2)} }
</style>
</head>

</nav>

const D = {"race":"2026-11-01","goal":"1:15 (Ziel) · 1:16–1:22 erwartet","sessions":[{"date":"2026-08-10","w":1,"type":"kraftB","title":"Kraft B — Zug & Carries","meta":"55–65 min · abends","km":0,"lines":["Warmup 8 min: Schulterkreisen, Pull-aparts, Scapula-Hangs an der Stange, Cat-Cow","Klimmzüge — 4 × 5–8 (oder Negative). Submaximal, nie bis zum Versagen","Einarmiges DB-Rudern — 4 × 10/Seite, abgestützt","Farmers Carry — 4 × 60 m @ 2×15 kg","Suitcase Carry (einseitig) — 3 × 40 m/Seite. Bestes Anti-Seitneige-Training für deinen Rücken","DB Hang Clean & Press — 4 × 8/Seite","Hollow Hold 3 × 30 s + Bird Dog 3 × 8/Seite"],"note":"Erste Einheit nach 3 Jahren Pause: alle Sätze mit 2–3 Wiederholungen im Tank beenden. RPE 6, nicht mehr.","zone":null,"tgt":null},{"date":"2026-08-11","w":1,"type":"easy","title":"Easy Run — 5 km","meta":"45 min · früh · 6:00–6:20 /km","km":5,"lines":["5 km bei 6:00–6:20 /km. Nasenatmung möglich, Gespräch problemlos","Danach: Rückenroutine (8 min) — ab heute jeden Tag"],"note":"Ja, das ist langsamer als du gewohnt bist. Genau das ist der Punkt.","zone":"E","tgt":"6:00-6:20"},{"date":"2026-08-12","w":1,"type":"quality","title":"Threshold — 3 × 6 min","meta":"50 min · 7 km total","km":7,"lines":["15 min Einlaufen locker","3 × 6 min @ 4:50–4:55 /km, dazwischen 90 s Trabpause","10 min Auslaufen"],"note":"Wenn der letzte Block wegbricht, war die Pace zu schnell — nicht du zu schwach.","zone":"T","tgt":"4:50-4:55"},{"date":"2026-08-13","w":1,"type":"kraftA","title":"Kraft A — Beine & Push","meta":"60–70 min · abends","km":0,"lines":["Warmup 8 min: Beinpendel, 90/90-Hüfte, 15 Glute Bridges, 10 Bodyweight-Lunges/Seite, Sprunggelenk-Mobility","DB Front-Rack Squat — 3 × 10 @ RPE 6","Bulgarian Split Squat — 3 × 10/Seite, Körpergewicht","Rumänisches Kreuzheben (RDL) — 3 × 10 leicht. Rücken neutral, Form vor Gewicht","DB Thruster — 3 × 12  (dein Wall-Ball-Ersatz: leicht, flüssig, viele Reps)","DB Schulterdrücken oder Push-ups — 3 × 10–12","Step-ups auf B /* Zeitangaben tolerant lesen. Auf dem iPhone gibt die Zifferntastatur kein „:“ her,
   deshalb wird eine reine Ziffernfolge nach Länge interpretiert:
   3 Ziffern → m:ss (440 → 4:40) · 4 Ziffern → mm:ss (1225 → 12:25)
   5–6 Ziffern → h:mm:ss. Trennzeichen : . , werden alle akzeptiert.        */
function parseTime(str){
  if(str==null)return null;
  let t=String(str).trim();
  if(!t)return null;
  if(/[:.,]/.test(t)){
    const p=t.split(/[:.,]/).map(x=>parseInt(x,10));
    if(p.some(isNaN))return null;
    if(p.length===2)return p[1]>59?null:p[0]*60+p[1];
    if(p.length>=3)return (p[1]>59||p[2]>59)?null:p[0]*3600+p[1]*60+p[2];
    return p[0]*60;
  }
  if(!/^\d+$/.test(t))return null;
  if(t.length<=2)return parseInt(t,10)*60;                         // "5" → 5:00
  const sec=+t.slice(-2);
  if(sec>59)return null;                                           // "465" ist keine Zeit
  if(t.length===3)return +t[0]*60 + sec;                            // "440" → 4:40
  if(t.length===4)return +t.slice(0,2)*60 + sec;                    // "1225" → 12:25
  if(t.length<=6){const m=+t.slice(-4,-2); if(m>59)return null;
    return +t.slice(0,-4)*3600 + m*60 + sec}
  return null;
}
/* Pace zusätzlich auf Plausibilität prüfen: 2:00–9:59 pro km. */
function parsePace(str){ const v=parseTime(str); return (v&&v>=120&&v<=599)?v:null }
function paceEcho(v){
  if(!v)return '';
  const p=parsePace(v);
  return p ? `verstanden als <b>${mmss(p)} /km</b>`
           : `<span class="bad">nicht erkannt — versuch 440 oder 4:40</span>`;
}
function timeEcho(v){
  if(!v)return '';
  const t=parseTime(v);
  return t&&t>60 ? `verstanden als <b>${mmss(t)}</b>`
                 : `<span class="bad">nicht erkannt — versuch 1225 oder 12:25</span>`;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2400)}

   die Startpaces des Plans verifiziert: 5 km 22:30 → VDOT 43,4 → Threshold 4:52. */
const vo2  = v => -4.60 + 0.182258*v + 0.000104*v*v;         // v in m/min
const pctV = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);
const vdotRace = (m,sec) => { const t=sec/60; return vo2(m/t)/pctV(t) };
const vFromVO2 = x => { const a=0.000104,b=0.182258,c=-4.60-x;
  return (-b+Math.sqrt(b*b-4*a*c))/(2*a) };
const paceOf = (vdot,frac) => 60000/vFromVO2(frac*vdot);     // Sekunden pro km
function raceTime(vdot,m){ let lo=1,hi=400;
  for(let i=0;i<70;i++){const t=(lo+hi)/2; if(vo2(m/t)/pctV(t)>vdot) lo=t; else hi=t}
  return (lo+hi)/2*60 }
/* Zonen als Anteil von VDOT. E/L bewusst etwas langsamer als das Modell —
   Grundlagenläufe sollen wirklich locker sein. */
const FRAC={E:[.655,.685],L:[.665,.695],M:[.79,.815],T:[.85,.868],I:[.965,.995],R:[1.04,1.08]};
const ZLBL={E:'Easy / Recovery',L:'Long Run',M:'Steady',T:'Threshold',I:'Intervall',R:'Rep'};
const ZTGT={T:7,I:8,R:8};                                     // erwartete Anstrengung
const EVZ=['T','I','R'];                                      // nur diese liefern Evidenz
const zoneBand=(vdot,z)=>FRAC[z].map(f=>paceOf(vdot,f)).sort((a,b)=>a-b);  // schnell → langsam

/* ═══════════ Formanalyse ═══════════ */
/* Basis nicht mehr die Selbstauskunft, sondern die gemessene Threshold-Leistung
   vom 12.08.: 3×6 min, wiederholbare Pace 4:39/km → VDOT 45.9 → 5 km ≈ 21:27.
   Ein echtes Zeitfahren im Tab „Form“ überschreibt das jederzeit. */
const BASE_VDOT=45.9;
const BASE_TT={m:5000,sec:null,vdot:BASE_VDOT,
  label:'3×6 min @ 4:39 am 12.08. (VDOT 45,9 · 5 km ≈ 21:27)'};

function anchor(){
  const tts=S.tt.filter(t=>t.m>0&&t.sec>0).sort((a,b)=>a.date<b.date?-1:1);
  if(tts.length){const l=tts[tts.length-1];
    return {vdot:vdotRace(l.m,l.sec), date:l.date,
      label:`${(l.m/1000).toFixed(l.m%1000?1:0)} km in ${mmss(l.sec)} am ${fmt(l.date)}`, measured:true}}
  return {vdot:BASE_TT.vdot, date:'2026-08-12', label:BASE_TT.label, measured:false};
}

function evidence(){
  const a=anchor();
  return D.sessions.filter(s=>EVZ.includes(s.zone))
    .filter(s=>parse(s.date)>=parse(a.date) && S.done[s.date])
    .map(s=>{
      const l=S.log[s.date]||{}, p=parsePace(l.pace), rpe=num(l.rpe);
      if(!p) return null;
      const implied=vo2(60000/p)/((FRAC[s.zone][0]+FRAC[s.zone][1])/2);
      const corr = isNaN(rpe) ? 0 : Math.max(-3, Math.min(1, ZTGT[s.zone]-rpe));
      const tgtBand=(s.tgt||'').split('-').map(x=>parseTime(x)).filter(Boolean);
      return {s, pace:p, rpe:isNaN(rpe)?null:rpe, implied, corr, vdot:implied+corr,
              tgt:tgtBand.length?tgtBand:null, delta:implied+corr-a.vdot};
    }).filter(Boolean);
}

/* Regeln, bewusst konservativ:
   – nur Qualitätseinheiten mit eingetragener Pace zählen
   – es braucht die letzten ZWEI, und sie müssen in dieselbe Richtung zeigen
   – Abweichung unter 0.8 VDOT gilt als Rauschen
   – die Anpassung wird halbiert und bei 1.5 VDOT je Schritt gedeckelt
   – Gesamtabstand zum Anker nie über 4 VDOT
   – ein Zeitfahren ersetzt die Regel und setzt den Anker direkt neu           */
function adapt(){
  const a=anchor(), ev=evidence();
  const r={anchor:a, ev, vdot:a.vdot, shift:0, status:'', why:''};
  if(!S.adapt){ r.status='aus'; r.why='Automatische Anpassung ist ausgeschaltet.'; return r }
  if(ev.length<2){ r.status='wartet';
    r.why=`Es braucht zwei Qualitätseinheiten mit eingetragener Pace. Vorhanden: ${ev.length}.`;
    return r }
  const last=ev.slice(-2), d=last.map(e=>e.delta), mean=(d[0]+d[1])/2;
  if(Math.sign(d[0])!==Math.sign(d[1])){ r.status='widersprüchlich';
    r.why='Die letzten zwei Qualitätseinheiten zeigen in verschiedene Richtungen — abwarten.';
    return r }
  if(Math.abs(mean)<0.8){ r.status='stabil';
    r.why='Abweichung unter 0,8 VDOT — das ist Tagesform, keine Formänderung.'; return r }
  const step=Math.sign(mean)*Math.min(Math.abs(mean)*0.5,1.5);
  r.shift=Math.max(-4,Math.min(4,step));
  r.vdot=a.vdot+r.shift;
  r.status = r.shift>0 ? 'schneller' : 'langsamer';
  r.why = r.shift>0
    ? `Zwei Qualitätseinheiten deutlich über Plan, bei passender Anstrengung. Zonen um ${Math.abs(r.shift).toFixed(1)} VDOT angehoben — gedämpft, nicht die volle Abweichung.`
    : `Zwei Qualitätseinheiten unter Plan oder bei zu hoher Anstrengung. Zonen um ${Math.abs(r.shift).toFixed(1)} VDOT gesenkt.`;
  return r;
}
const curVdot=()=>adapt().vdot;

/* ═══════════ Claude-Anbindung ═══════════ */
function zoneLines(vdot){
  return Object.keys(FRAC).map(z=>{const b=zoneBand(vdot,z);
    return `${ZLBL[z]}: ${mmss(b[0])}–${mmss(b[1])} /km`});
}

    const dn=tr.filter(s=>S.done[s.date]).length;
    const km=ss.reduce((x,s)=>x+(S.done[s.date]?(num((S.log[s.date]||{}).km)||s.km):0),0);
    const rp=tr.map(s=>num((S.log[s.date]||{}).rpe)).filter(x=>x>0);
    return [`W${n}`,`${dn}/${tr.length}`,`${Math.round(km)} / ${w.km} km`,
      rp.length?(rp.reduce((x,y)=>x+y,0)/rp.length).toFixed(1):'–'];
  });
  const bk=DATES.filter(d=>parse(d)<=parse(TODAY));
  const bkd=bk.filter(d=>S.back[d]).length;
  const worst=Object.values(S.log).map(l=>+l.back).filter(x=>x>=0);
  const ttli=S.tt.length?S.tt.map((t,i)=>
    `<li><div class="h"><b>${(t.m/1000).toFixed(t.m%1000?1:0)} km in ${mmss(t.sec)}</b>
      <span class="d">${fmt(t.date)}</span></div>
      <div class="r">VDOT ${vdotRace(t.m,t.sec).toFixed(1)}
      <button data-deltt="${i}" style="color:var(--hot);font-size:.9em;font-weight:700;margin-left:8px">löschen</button></div></li>`).join('')
    : `<li><div class="r">Noch kein Zeitfahren. Ein 3-km- oder 5-km-Test ist die einzige
        wirklich verlässliche Grundlage für die Zonen.</div></li>`;
  const st={aus:'off',wartet:'acc',stabil:'ok','widersprüchlich':'warn',schneller:'ok',langsamer:'warn'}[a.status]||'acc';

  return `
  <article class="card ${st==='off'?'':st}"><div class="ct">Formcheck</div>
    <div class="kpi2">
      <div><div class="l">VDOT jetzt</div><div class="v">${vd.toFixed(1)}${a.shift?` <span style="font-size:.7em;color:var(--tx3)">${a.shift>0?'+':''}${a.shift.toFixed(1)}</span>`:''}</div></div>
      <div><div class="l">5-km-Prognose</div><div class="v">${mmss(raceTime(vd,5000))}</div></div>
    </div>
    <div class="sub" style="margin-top:12px"><b>${esc(a.status)}.</b> ${esc(a.why)}</div>
    <div class="sub" style="margin-top:8px">Basis: ${esc(a.anchor.label)}</div>
    <h3 style="font-size:.8em;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px">Evidenz</h3>
    <ul class="ev">${evli}</ul>
    <button class="big ghost sm" data-adapt aria-pressed="${!!S.adapt}">
      ${S.adapt?'Automatische Anpassung: an':'Automatische Anpassung: aus'}</button>
    <div class="sub" style="margin-top:10px">Die Anpassung ist absichtlich träge: sie braucht
      zwei Qualitätseinheiten in dieselbe Richtung, halbiert die Abweichung und deckelt jeden
      Schritt. Zu schnelle Anhebung ist der klassische Weg in eine Überlastung — besonders bei
      dir, weil Laufumfang und Kraftwiedereinstieg gerade gleichzeitig steigen.</div></article>

  <article class="card acc"><div class="ct">Zeitfahren eintragen</div>
    <div class="sub">Ein gemessener Test setzt die Basis direkt neu und überschreibt die
      Schätzung. Am besten flach, ausgeruht, gleichmäßig.</div>
    <div class="fields">
      <div class="f"><label for="ttd">Distanz</label>
        <select id="ttd"><option value="3000">3 km</option><option value="5000" selected>5 km</option>
        <option value="10000">10 km</option><option value="1000">1 km</option></select></div>
      <div class="f"><label for="ttt">Zeit
        <span class="hint">1225 oder 12:25</span></label>
        <input id="ttt" type="text" inputmode="decimal" autocomplete="off"
          placeholder="1225  oder  12:25" aria-describedby="tte">
        <span class="echo" id="tte"></span></div>
      <div class="f full"><label for="ttdate">Datum</label>
        <input id="ttdate" type="date" value="${TODAY}" min="${FIRST}"></div>
    </div>
    <button class="big sm" id="addtt">Zeitfahren speichern</button>
    <h3 style="font-size:.8em;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 4px">Gespeichert</h3>
    <ul class="ev">${ttli}</ul></article>

  <article class="card ok"><div class="ct">Block 1 auf einen Blick</div>
    <div class="tb"><table><thead><tr><th>Woche</th><th>Einheiten</th><th>Kilometer</th><th>ø RPE</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="sub" style="margin-top:10px">Rückenroutine: <b>${bkd} von ${bk.length}</b> Tagen${worst.length?` · schlechtester Rücken-Score: ${BACKLBL[Math.max(...worst)]}`:''}</div></article>

  <article class="card acc"><div class="ct">Was am 06.09. gebraucht wird</div>
    <ul class="steps">${D.asks.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <a class="big coach" id="blk" href="#" target="_blank" rel="noopener">Block mit Claude auswerten</a>
    <button class="big" id="exp">Zusammenfassung teilen</button>
    <button class="big ghost" id="cpy">In die Zwischenablage kopieren</button></article>

  <article class="card"><div class="ct">Daten</div>
    <div class="sub">Alles liegt nur auf diesem Gerät. Kein Konto, kein Server.</div>
    <button class="big ghost" id="rst" style="border-color:var(--hot);color:var(--hot)">Alle Eingaben löschen</button></article>`;
}

function report(){
  const a=adapt();
  let o=[`HYROX BLOCK 1 — Bericht vom ${fmt(TODAY)}`,`Ziel: ${D.goal} · Rennen ${D.race}`,
    `VDOT jetzt ${a.vdot.toFixed(1)} · 5-km-Prognose ${mmss(raceTime(a.vdot,5000))}`,''];
  for(const[n,w] of Object.entries(D.weeks)){
    const ss=D.sessions.filter(s=>s.w==n), tr=ss.filter(s=>s.type!=='rest');
    const km=ss.reduce((x,s)=>x+(S.done[s.date]?(num((S.log[s.date]||{}).km)||s.km):0),0);
    o.push(`## ${w.label} — ${tr.filter(s=>S.done[s.date]).length}/${tr.length} Einheiten, ${Math.round(km)} von ${w.km} km`);
    ss.filter(s=>s.type!=='rest'||S.log[s.date]?.note).forEach(s=>{const l=S.log[s.date]||{};
      const bits=[S.done[s.date]?'erledigt':'offen'];
      if(l.km)bits.push(l.km+' km'); if(l.pace)bits.push(l.pace+' /km'); if(l.rpe)bits.push('RPE '+l.rpe);
      if(l.back!=null&&l.back!=='')bits.push('Rücken: '+BACKLBL[l.back]);
      o.push(`- ${s.date} ${s.title}${s.tgt?` (Ziel ${s.tgt})`:''} — ${bits.join(', ')}`);
      if(l.note)o.push(`    ${l.note.replace(/\n/g,'\n    ')}`)});
    o.push('');
  }
  const bk=DATES.filter(d=>parse(d)<=parse(TODAY));
  o.push(`Rückenroutine: ${bk.filter(d=>S.back[d]).length}/${bk.length} Tage`);
  if(S.tt.length)o.push('Zeitfahren: '+S.tt.map(t=>`${t.m/1000} km ${mmss(t.sec)} (${t.date})`).join(', '));
  return o.join('\n');
}

/* ═══════════ Rendern ═══════════ */
let tab='day';
const VIEWS={day:vDay,plan:vPlan,ref:vRef,log:vLog};
function render(keep){
  const y=keep?window.scrollY:0;
  document.getElementById('view').innerHTML=VIEWS[tab]();
  const blk=document.getElementById('blk'); if(blk)blk.href=claudeUrl(blockPrompt());
  head(); window.scrollTo(0,keep?y:0);
}
function setTab(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  setTab(b.dataset.tab);
  document.getElementById('live').textContent=b.textContent.trim()+' geöffnet';
});

/* ═══════════ Interaktion ═══════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle],[data-back],[data-backday],[data-open],[data-cp],'
    +'[data-step],[data-goto],[data-adapt],[data-deltt],#addtt,#exp,#cpy,#rst');
  if(!t)return;
  if(t.hasAttribute('data-toggle')){
    const d=t.dataset.toggle; S.done[d]=!S.done[d]; if(!S.done[d])delete S.done[d];
    save(); render(true); toast(S.done[d]?'Erledigt ✓':'Wieder offen');
  } else if(t.hasAttribute('data-back')){
    const d=t.dataset.d; (S.log[d]=S.log[d]||{}).back=+t.dataset.back; save(); render(true);
  } else if(t.hasAttribute('data-backday')){
    const d=t.dataset.backday; S.back[d]=!S.back[d]; if(!S.back[d])delete S.back[d];
    save(); render(true); toast(S.back[d]?'Rücken erledigt ✓':'Wieder offen');
  } else if(t.hasAttribute('data-open')){
    cur=t.dataset.open; setTab('day');
    document.getElementById('live').textContent=fmt(cur)+' geöffnet';
  } else if(t.hasAttribute('data-step')){
    const i=DATES.indexOf(cur)+ +t.dataset.step;
    if(i>=0&&i<DATES.length){cur=DATES[i]; render()}
  } else if(t.hasAttribute('data-goto')){
    cur=t.dataset.goto; render();
  } else if(t.hasAttribute('data-adapt')){
    S.adapt=!S.adapt; save(); render(true);
    toast(S.adapt?'Automatische Anpassung an':'Automatische Anpassung aus');
  } else if(t.hasAttribute('data-deltt')){
    S.tt.splice(+t.dataset.deltt,1); save(); render(true); toast('Zeitfahren gelöscht');
  } else if(t.id==='addtt'){
    const m=+document.getElementById('ttd').value;
    const sec=parseTime(document.getElementById('ttt').value);
    const date=document.getElementById('ttdate').value||TODAY;
    if(!sec){toast('Zeit bitte als mm:ss eingeben, z.B. 21:40');return}
    const v=vdotRace(m,sec);
    if(v<25||v>85){toast('Das ergibt VDOT '+v.toFixed(0)+' — bitte Distanz und Zeit prüfen');return}
    S.tt.push({m,sec,date}); S.tt.sort((a,b)=>a.date<b.date?-1:1); save(); render();
    toast(`Basis neu gesetzt: VDOT ${v.toFixed(1)}, Threshold ${mmss(zoneBand(v,'T')[0])}–${mmss(zoneBand(v,'T')[1])}`);
  } else if(t.hasAttribute('data-cp')){
    navigator.clipboard?.writeText(promptFor(byDate[t.dataset.cp])).then(
      ()=>toast('Prompt kopiert — in Claude einfügen'),()=>toast('Kopieren nicht möglich'));
  } else if(t.id==='exp'){
    const txt=report();
    if(navigator.share)navigator.share({title:'Hyrox Block 1',text:txt}).catch(()=>{});
    else{navigator.clipboard?.writeText(txt);toast('Kopiert')}
  } else if(t.id==='cpy'){
    navigator.clipboard?.writeText(report()).then(()=>toast('In die Zwischenablage kopiert'),
      ()=>toast('Kopieren nicht möglich'));
  } else if(t.id==='rst'){
    if(confirm('Wirklich alle Häkchen, Zahlen und Notizen löschen?')){
      S={done:{},log:{},back:{},tt:[],adapt:true,fs:S.fs,th:S.th}; save(); render(); toast('Zurückgesetzt')}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ttt'){ const el=document.getElementById('tte');
    if(el)el.innerHTML=timeEcho(t.value); return }
  if(!t.dataset.log)return;
  const d=t.dataset.d; (S.log[d]=S.log[d]||{})[t.dataset.log]=t.value; save();
  if(t.dataset.log==='pace'){
    const el=document.getElementById('pe-'+d); if(el)el.innerHTML=paceEcho(t.value);
    const zl=document.getElementById('zl-'+d);
    if(zl){const b=zoneBand(curVdot(),byDate[d].zone);
      zl.innerHTML=`${mmss(b[0])}–${mmss(b[1])} /km`}
  }
  head();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.log==='pace'&&tab==='day'){ head() }
});

/* ═══════════ Einstellungen ═══════════ */
const FS=[.94,1,1.12,1.26];
const applyFs=()=>document.documentElement.style.setProperty('--fs',FS[S.fs]+'rem');
document.getElementById('fsBtn').onclick=()=>{S.fs=(S.fs+1)%FS.length;save();applyFs();
  document.getElementById('live').textContent='Schriftgröße '+(S.fs+1)+' von '+FS.length};
document.getElementById('thBtn').onclick=()=>{
  S.th=S.th==='auto'?'light':S.th==='light'?'dark':'auto'; save();
  document.documentElement.dataset.th=S.th==='auto'?'':S.th;
  toast(S.th==='auto'?'Systemeinstellung':S.th==='light'?'Hell':'Dunkel')};
applyFs(); if(S.th!=='auto')document.documentElement.dataset.th=S.th;
render();

if('serviceWorker' in navigator) addEventListener('load',()=>
  navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
