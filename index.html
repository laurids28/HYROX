<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyrox 01.11.</title>
<meta name="description" content="Trainingsplan Hyrox Single Open, 01.11.2026">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hyrox">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2b3140;
  --tx:#e8ebf1; --tx2:#a8b1c1; --tx3:#767f90;
  --acc:#5aa9ff; --ok:#79d69f; --warn:#f2b65e; --hot:#f4817e;
  --fs:1rem; --tap:46px;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f5f6f8; --card:#fff; --card2:#eef0f4; --line:#dde1e8;
    --tx:#14181e; --tx2:#4b5462; --tx3:#767f90;
    --acc:#0b62c4; --ok:#178054; --warn:#8f5a06; --hot:#c0322f; }
}
html[data-th="dark"]{ color-scheme:dark }
html[data-th="light"]{ color-scheme:light;
  --bg:#f5f6f8; --card:#fff; --card2:#eef0f4; --line:#dde1e8;
  --tx:#14181e; --tx2:#4b5462; --tx3:#767f90;
  --acc:#0b62c4; --ok:#178054; --warn:#8f5a06; --hot:#c0322f; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(66px + var(--sab));overscroll-behavior-y:contain}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.25}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:1.02em;font-weight:700;flex:1;min-width:0}
.hrow h1 span{display:block;font-size:.72em;font-weight:500;color:var(--tx3);letter-spacing:0}
.iconbtn{min-width:var(--tap);min-height:var(--tap);flex:0 0 auto;display:inline-flex;
  align-items:center;justify-content:center;gap:1px;white-space:nowrap;
  border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:.82em;font-weight:700;color:var(--tx2)}
.iconbtn sup{font-size:.72em;line-height:1}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.barlab{display:flex;justify-content:space-between;font-size:.72em;color:var(--tx3);margin-top:5px;
  font-variant-numeric:tabular-nums}

main{padding:16px 16px 24px;max-width:640px;margin:0 auto}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card.acc{border-left:4px solid var(--acc)}
.card.warn{border-left:4px solid var(--warn)}
.card.hot{border-left:4px solid var(--hot)}
.card.ok{border-left:4px solid var(--ok)}
.ct{font-weight:700;font-size:.95em;margin-bottom:6px}
.sub{color:var(--tx2);font-size:.86em}
.tag{display:inline-block;font-size:.66em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;vertical-align:2px}
.t-run{background:rgba(90,169,255,.16);color:var(--acc)}
.t-str{background:rgba(121,214,159,.16);color:var(--ok)}
.t-hyx{background:rgba(242,182,94,.18);color:var(--warn)}
.t-off{background:rgba(150,160,180,.16);color:var(--tx3)}
.t-tst{background:rgba(244,129,126,.16);color:var(--hot)}

/* Tagesnavigation */
.daynav{display:flex;align-items:stretch;gap:8px;margin:0 0 14px}
.daynav button{flex:0 0 auto;min-width:52px;min-height:var(--tap);border-radius:12px;
  background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:1.2em;font-weight:700}
.daynav button[disabled]{opacity:.35}
.daynav .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:6px 8px;text-align:center}
.daynav .mid b{font-size:.9em;line-height:1.2}
.daynav .mid span{font-size:.7em;color:var(--tx3)}
.daynav .today{min-width:auto;padding:0 12px;font-size:.78em;font-weight:700;color:var(--acc)}

.today .dt{font-size:.78em;color:var(--tx3);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.today h2{font-size:1.5em;margin:6px 0 4px}
.today .meta{font-size:.85em;color:var(--tx2);font-variant-numeric:tabular-nums}
ul.steps{list-style:none;padding:0;margin:14px 0 0}
ul.steps li{position:relative;padding:9px 0 9px 26px;border-bottom:1px solid var(--line);font-size:.92em}
ul.steps li:last-child{border-bottom:none}
ul.steps li::before{content:"";position:absolute;left:6px;top:1.05em;width:7px;height:7px;
  border-radius:50%;background:var(--tx3)}
ul.steps li.arrow{padding-left:26px;color:var(--tx2);font-size:.87em}
ul.steps li.arrow::before{content:"→";background:none;left:4px;top:.55em;width:auto;height:auto;
  color:var(--acc);font-weight:700;font-size:.95em}
.big{width:100%;min-height:54px;border-radius:14px;font-weight:750;font-size:1em;
  display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;
  background:var(--acc);color:#fff;border:1px solid transparent}
.big[aria-pressed="true"]{background:var(--ok);color:#06231a}
html[data-th="dark"] .big[aria-pressed="true"]{color:#04180f}
.big.ghost{background:var(--card2);color:var(--tx);border-color:var(--line)}
a.big{margin-top:10px;text-decoration:none}
.big.coach{background:linear-gradient(135deg,#c96442,#a8502f);color:#fff;border-color:transparent}
.big.sm{min-height:46px;font-size:.9em;margin-top:10px}

.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.f{display:flex;flex-direction:column;gap:5px}
.f.full{grid-column:1/-1}
.f label{font-size:.74em;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.f input,.f textarea,.f select{background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:11px;padding:12px;font:inherit;font-size:.92em;min-height:var(--tap);width:100%}
.f textarea{min-height:84px;resize:vertical;font-family:inherit}
.f .hint{font-size:.72em;color:var(--tx3);font-weight:500;text-transform:none;letter-spacing:0}
.echo{font-size:.78em;color:var(--tx2);min-height:1.1em;font-variant-numeric:tabular-nums}
.echo b{font-family:var(--mono);color:var(--ok)}
.echo .bad{color:var(--hot)}
.exh{font-size:.78em;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;
  font-weight:700;margin:18px 0 6px}
.exlist{border-top:1px solid var(--line)}
.exrow{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);
  padding:2px 0}
.exd{flex:1;min-width:0}
.exd>summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;
  gap:10px;align-items:center;min-height:44px}
.exd>summary::-webkit-details-marker{display:none}
.exd .xt{flex:1;min-width:0}
.exd .xn{display:block;font-weight:650;font-size:.92em;line-height:1.35}
.exd .xs{display:block;font-size:.8em;color:var(--tx2);font-variant-numeric:tabular-nums;line-height:1.35}
.exd .qm{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--card2);
  border:1px solid var(--line);color:var(--tx3);font-size:.72em;font-weight:800;
  display:grid;place-items:center;align-self:center}
.exd[open] .qm{background:var(--acc);border-color:transparent;color:#fff}
.exd .how{font-size:.86em;color:var(--tx2);padding:2px 0 14px;line-height:1.6}
.kgw{flex:0 0 78px;padding-top:7px}
.kgw input{width:78px;background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:9px 8px;font:inherit;font-size:.86em;text-align:center;
  min-height:40px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:var(--tap);border-radius:11px;background:var(--card2);
  border:1px solid var(--line);font-size:.86em;font-weight:650;color:var(--tx2)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:transparent}

.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 14px;overflow:hidden}
.wk>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;
  gap:4px 8px;align-items:center;flex-wrap:wrap;min-height:var(--tap)}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary b{flex:0 0 auto;font-size:.95em}
.wk>summary em{flex:1 1 auto;min-width:0;font-style:normal;font-weight:500;color:var(--tx3);font-size:.8em}
.wk>summary .km{flex:0 0 auto;margin-left:auto;font-size:.75em;color:var(--tx2);white-space:nowrap;
  font-variant-numeric:tabular-nums;background:var(--card2);border-radius:99px;padding:3px 9px}
.wbody{border-top:1px solid var(--line);padding:4px 16px 12px}
.drow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;min-height:var(--tap)}
.drow:last-child{border-bottom:none}
.drow .dd{font-size:.72em;color:var(--tx3);font-weight:700;width:34px;flex:0 0 34px;line-height:1.3}
.drow .dd b{display:block;color:var(--tx);font-size:1.15em}
.drow .di{flex:1;min-width:0}
.drow .di .n{display:block;font-weight:650;font-size:.9em;line-height:1.35}
.drow .di .m{display:block;font-size:.76em;color:var(--tx3);line-height:1.35}
.drow .ck{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);
  display:grid;place-items:center;font-size:.8em;color:transparent}
.drow[data-ck="1"] .ck{background:var(--ok);border-color:var(--ok);color:#04180f}
.drow[data-today="1"]{background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 12%,transparent),transparent);
  margin:0 -16px;padding-left:16px;padding-right:16px}
.drow[data-cur="1"] .di .n{color:var(--acc)}

.tb{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -4px 0}
table{width:100%;border-collapse:collapse;font-size:.84em}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78em;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
td.n{font-family:var(--mono);white-space:nowrap;font-size:.95em}
tr:last-child td{border-bottom:none}
td .up{color:var(--ok);font-weight:700}
td .dn{color:var(--hot);font-weight:700}

.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dots span{width:11px;height:11px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.dots span.on{background:var(--ok);border-color:var(--ok)}
.dots span.tdy{outline:2px solid var(--acc);outline-offset:1px}

.ev{margin:0;padding:0;list-style:none;font-size:.87em}
.ev li{padding:10px 0;border-bottom:1px solid var(--line)}
.ev li:last-child{border-bottom:none}
.ev .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ev .h b{font-weight:650}
.ev .h .d{color:var(--tx3);font-size:.85em;font-variant-numeric:tabular-nums}
.ev .r{color:var(--tx2);font-size:.92em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi2 div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.kpi2 .l{font-size:.68em;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3);font-weight:700}
.kpi2 .v{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav button{flex:1;min-height:62px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:.68em;font-weight:700;color:var(--tx3);letter-spacing:.02em}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--sab));
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.85em;
  font-weight:650;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-contrast: more){ :root{--line:#6b7484} .sub,.f label{color:var(--tx2)} }
</style>
</head>

<header>

</nav>

Prone Row + DB-Rudern","Technisch anspruchsvollste Station. Rücken beachten."],["80 m Burpee Broad Jumps","1:1 möglich — jeden Samstag draußen","Bei 193 cm teuer. Deshalb ab Woche 1 dabei."],["1000 m Row","—","Nicht ersetzbar. Ab 01.09."],["200 m Farmers Carry (2×24 kg)","Farmers Hold im Stand, 40–60 s @ 2×20 kg","Kein Platz zum Gehen. Griff ist zeitabhängig — Reiz bleibt."],["100 m Sandbag Lunges (20 kg)","Rucksack mit 15–20 kg, Walking Lunges","Rucksack > Hanteln, weil die Last oben liegt."],["100 Wall Balls (6 kg, 3,05 m)","DB Thruster 2×8–10 kg, hohe Reps","Deine leichteste Station — 250 cm Reichhöhe."]],"budget":[["8 Laufsplits (inkl. Roxzone)","≈ 38:50","ø 4:51/km — nach jeder Station"],["8 Stationen","≈ 32:00","z.B. Ski 4:20 · Row 4:00 · Wall Balls 5:40"],["Übergänge / Puffer","≈ 5:00","Realität"]],"back":[{"id":"bk_curlup","spec":"","log":false},{"id":"bk_sideplank","spec":"","log":false},{"id":"bk_birddog","spec":"","log":false},{"id":"bk_bridge","spec":"","log":false},{"id":"bk_hipflex","spec":"","log":false},{"id":"bk_9090","spec":"","log":false}],"exlib":{"wu_a":{"n":"Warmup — Beine (8 min)","h":"Beinpendel vor/zurück und seitlich 10× pro Seite · 90/90-Hüfte 8 Wechsel pro Seite · 15 Glute Bridges · 10 Bodyweight-Lunges pro Seite · Sprunggelenk: Knie über Zehen an der Wand 10× pro Seite.\n\nZiel ist warm werden und Bewegungsumfang öffnen, nicht dehnen. Statisches Dehnen vor dem Krafttraining senkt kurzfristig die Kraft — das gehört nach hinten."},"wu_b":{"n":"Warmup — Oberkörper (8 min)","h":"Schulterkreisen 15× vor und zurück · Schulterblätter 10× nach hinten unten ziehen und lösen · Handtuch-Pull-aparts 2×15 (Handtuch straff, Arme lang, nach außen ziehen) · Cat-Cow 10× langsam · Katzenbuckel im Vierfüßler mit Rotation 8× pro Seite.\n\nDie Pull-aparts sind wichtig: sie aktivieren die hintere Schulter, die bei allen Zugübungen und beim Sled Pull arbeitet."},"front_squat":{"n":"DB Front-Rack Squat","h":"Hanteln auf den Schultern ablegen, Ellbogen hoch nach vorn, Oberarme fast waagerecht. Füße schulterbreit, Zehen leicht nach außen. Tief hocken bis die Hüfte unter Kniehöhe kommt, Rücken bleibt gerade, Ferse bleibt am Boden.\n\nBei 193 cm ist Tiefe ehrliche Arbeit — geh so tief wie du kannst ohne dass das Becken hinten wegkippt. Genau diese Tiefe brauchst du bei den Wall Balls.\n\nTypischer Fehler: Ellbogen fallen nach unten, dann rundet der Rücken. Ellbogen hoch, Brust raus."},"split_squat":{"n":"Bulgarian Split Squat","h":"Hinterer Fuß auf Stuhl oder Sofakante, vorderer Fuß etwa zwei Schuhlängen davor. Senkrecht nach unten absinken bis das hintere Knie fast den Boden berührt, Gewicht zu 80 % auf dem vorderen Bein. Rumpf aufrecht.\n\nDas ist deine wichtigste Übung für die Sandbag Lunges — 100 m mit 20 kg sind bei deiner Schrittlänge rund 60 Wiederholungen einbeinig.\n\nTypischer Fehler: zu kurzer Abstand, dann wird es eine Kniebeuge auf einem Bein und das vordere Knie schiebt weit über die Zehen. Lieber einen Fuß weiter nach vorn."},"rdl":{"n":"Rumänisches Kreuzheben (RDL)","h":"Hanteln oder Ladestange vor den Oberschenkeln, Knie minimal gebeugt und dann fixiert. Hüfte nach hinten schieben, Gewicht dicht am Bein nach unten führen bis du die Oberschenkelrückseite deutlich spürst — meist etwa Kniehöhe. Rücken bleibt die ganze Zeit neutral.\n\nACHTUNG RÜCKEN: Das ist die Übung mit dem größten Risiko für dich. Form vor Gewicht, immer. Wenn du das Gefühl hast der untere Rücken übernimmt statt der Oberschenkel, ist das Gewicht zu hoch oder du gehst zu tief.\n\nEs ist eine Hüftbewegung, keine Kniebeuge. Die Knie bleiben wo sie sind."},"thruster":{"n":"DB Thruster","h":"Hanteln auf den Schultern, tiefe Kniebeuge, und aus der Aufwärtsbewegung heraus direkt über den Kopf drücken. Eine flüssige Bewegung, kein Stopp oben in der Hocke.\n\nDas ist dein Ersatz für die 100 Wall Balls. Deshalb leicht und viele Wiederholungen statt schwer — es geht um den Atem und den Rhythmus, nicht um Kraft.\n\nRhythmus zählen: runter–hoch–drücken, ohne Pause. Wenn du zwischen den Wiederholungen stehen bleibst, trainierst du die falsche Qualität."},"ohp":{"n":"DB Schulterdrücken","h":"Stehend, Hanteln auf Schulterhöhe, Handflächen nach vorn. Gerade nach oben drücken bis die Arme lang sind, Rippen unten halten. Kontrolliert absenken.\n\nWenn du ins Hohlkreuz gehst um das Gewicht hochzubringen: Gewicht runter. Bauch leicht anspannen, Becken neutral.\n\nAlternative wenn die Schulter zickt: Push-ups, 3 × 10–12."},"stepup":{"n":"Step-ups","h":"Auf Bank, Stuhl oder Treppenstufe steigen, Höhe etwa Kniehöhe. Mit dem oberen Bein hochdrücken, nicht mit dem unteren abstoßen. Kontrolliert wieder absenken statt runterfallen.\n\nDas Absenken ist der wertvolle Teil — genau die Belastung, die beim Bergabteil und in den späten Lunges auftritt.\n\nHanteln hängen einfach seitlich in den Händen."},"core_a":{"n":"Rumpf — Dead Bug + Side Plank","h":"Dead Bug: auf dem Rücken, Arme senkrecht nach oben, Knie über der Hüfte. Ein Bein und den gegenüberliegenden Arm langsam ausstrecken, ohne dass der untere Rücken vom Boden abhebt. 3 × 10 pro Seite.\n\nSide Plank: seitlich auf dem Unterarm, Körper eine Linie, Hüfte hoch. 3 × 35 s pro Seite.\n\nBeim Dead Bug eine Hand unter die Lende legen und darauf achten, dass der Druck gleich bleibt. Sobald er nachlässt, kippt das Becken — dann kleinere Bewegung."},"table_row":{"n":"Tisch-Rudern (Inverted Row)","h":"Unter einen stabilen Tisch legen, die Kante schulterbreit greifen, Körper von Kopf bis Ferse eine gerade Linie. Brust zur Tischkante ziehen, Schulterblätter zusammen, dann langsam ablassen.\n\nErsetzt deine Klimmzüge, solange die Stange defekt ist. Schwerer machen: Füße weiter nach vorn oder auf einen Stuhl legen. Leichter: Knie beugen und Füße näher heranstellen.\n\nVorher prüfen dass der Tisch das trägt und nicht kippt. Wenn es keinen geeigneten Tisch gibt: diese Übung weglassen und beim DB-Rudern einen Satz mehr machen."},"db_row":{"n":"Einarmiges DB-Rudern","h":"Ein Knie und die gleichseitige Hand auf Stuhl oder Sofakante, Rücken flach und waagerecht. Hantel senkrecht nach oben zur Hüfte ziehen, Ellbogen dicht am Körper. Oben kurz halten, dann über 2 Sekunden langsam ablassen.\n\nDas langsame Ablassen ist hier der eigentliche Reiz und ersetzt einen Teil des Klimmzug-Volumens. Zähl mit.\n\nDer Oberkörper bleibt still. Wenn du dich mit dem Rumpf mitdrehst, ist das Gewicht zu hoch."},"pullover":{"n":"DB Pullover am Boden","h":"Auf dem Rücken liegen, eine Hantel mit beiden Händen halten, Arme fast gestreckt über der Brust. Die Hantel im Bogen über den Kopf nach hinten führen bis du den Latissimus und die Rippen spürst, dann zurück.\n\nDas ist das Zugmuster vom SkiErg: Kraft aus dem Lat über den langen Arm. Bei 1,93 m ist dein Zugweg lang — das ist im Rennen ein Vorteil, hier ist es die Vorbereitung.\n\nRippen unten halten, nicht ins Hohlkreuz ausweichen. Lieber weniger weit nach hinten und dafür der Rücken am Boden."},"farmers_hold":{"n":"Farmers Hold (im Stand)","h":"Beide Hanteln aufnehmen und einfach stehen bleiben. Schultern nach hinten unten, Brust raus, Arme lang, Griff so lange halten wie es geht.\n\nErsetzt den Farmers Carry, weil du die Strecke nicht hast. Im Rennen ist der Griff der Limiter, nicht die Beine — und Griffkraft ist zeitabhängig, nicht wegabhängig. Der Trainingsreiz bleibt also fast vollständig erhalten.\n\nBis kurz vor dem Aufgeben halten, aber nicht bis die Hantel fällt. Wenn 45 s zu leicht werden: Zeit verlängern, nicht Gewicht erhöhen — 20 kg pro Seite ist dein Maximum und im Rennen sind es 24 kg."},"suitcase_hold":{"n":"Suitcase Hold (einseitig)","h":"Nur eine Hantel in einer Hand, aufrecht stehen, 30 Sekunden. Dann wechseln.\n\nDie Arbeit passiert auf der freien Seite: dein Rumpf verhindert, dass du zur Seite kippst. Das ist das beste Anti-Seitneige-Training und geht direkt gegen deine Rückenbaustelle.\n\nIm Spiegel oder am Türrahmen prüfen: Schultern waagerecht, Hüfte waagerecht, nicht zur leichten Seite lehnen. Genau das Ausweichen wollen wir verhindern."},"prone_row":{"n":"Prone Row (Bauchlage)","h":"Flach auf den Bauch legen, Hanteln neben den Schultern auf dem Boden, Stirn leicht angehoben. Beide Hanteln nach oben zur Hüfte ziehen, Ellbogen dicht am Körper, Schulterblätter zusammen. Oben 1 s halten, langsam ablassen.\n\nErsetzt das Tisch-Rudern. Der große Vorteil für dich: der Brustkorb liegt auf dem Boden, also trägt der untere Rücken **null** Last. Von allen Rudervarianten ist das die mit dem geringsten Risiko für deine Baustelle.\n\nDer Bewegungsradius ist kleiner als beim normalen Rudern — das ist okay. Dafür lässt sich hier nicht schummeln: du kannst nicht mit dem Rumpf mitreißen, weil du liegst. Wenn es zu leicht ist, oben 2 s halten statt schwerer zu machen."},"high_pull":{"n":"DB High Pull","h":"Hanteln vor den Oberschenkeln, leicht in die Knie, dann explosiv aus der Hüfte aufrichten und die Hanteln dicht am Körper bis auf Brusthöhe hochziehen — Ellbogen führen nach oben außen, höher als die Hände.\n\nDas ist dein Ersatz für das vertikale Ziehen, das ohne Klimmzugstange fehlt. Ellbogen über Handhöhe trainiert genau die Muskulatur, die beim Sled Pull und beim SkiErg-Zug arbeitet.\n\nKraft aus der Hüfte, Arme ziehen nur nach. Wenn du langsam und nur mit den Armen ziehst, ist es zu schwer — runter mit dem Gewicht."},"hang_clean":{"n":"DB Hang Clean & Press","h":"Hantel hängt vor dem Oberschenkel. Explosiv aus der Hüfte hochziehen, unter der Hantel die Hand drehen und auf der Schulter fangen, dann über Kopf drücken. Kontrolliert zurückführen.\n\nSchnellkraft aus der Hüfte — dieselbe Bewegung, die dich beim Burpee Broad Jump nach vorn bringt und beim Sled Push antreibt.\n\nDie Kraft kommt aus der Hüfte, nicht aus dem Arm. Wenn du die Hantel mit dem Bizeps hochreißt, ist sie zu schwer."},"core_b":{"n":"Rumpf — Hollow Hold + Bird Dog","h":"Hollow Hold: auf dem Rücken, Lende in den Boden gedrückt, Beine und Schultern leicht angehoben, Arme über Kopf. 3 × 30 s.\n\nBird Dog: Vierfüßler, gegenüberliegenden Arm und Bein lang ausstrecken, 2 s halten. 3 × 8 pro Seite, langsam.\n\nBeim Hollow Hold: wenn die Lende sich vom Boden löst, Beine höher nehmen. Beim Bird Dog darf das Becken nicht kippen — stell dir ein Wasserglas auf dem unteren Rücken vor."},"finisher_b":{"n":"Finisher (3 Runden)","h":"3 Runden ohne Pause: 10 Burpees · 20 Mountain Climbers · 30 s Plank. Zwischen den Runden 60 s Pause.\n\nKurzer Konditionsreiz am Ende, wenn noch Luft ist. Bei den Burpees Technik behalten statt Tempo — aus der Hüfte, weiche Landung.\n\nWenn der Rücken heute schon gemeldet hat: Finisher weglassen."},"ski":{"n":"SkiErg","h":"Griffe über Kopf greifen, Arme lang. Der Antrieb kommt aus Hüfte und Rumpf: nach vorn beugen und dabei die Griffe an den Körper vorbei nach unten ziehen. Arme führen nur, sie reißen nicht.\n\nBei 193 cm ist dein Zugweg lang — das ist Effizienz, wenn du ihn nutzt. Kurz und hektisch hacken verschenkt genau diesen Vorteil.\n\nDamping 5–7. Rhythmus: kräftiger Zug, dann entspannt wieder hoch."},"row":{"n":"Rower","h":"Reihenfolge im Zug: Beine drücken, dann Rumpf aufrichten, dann Arme anziehen. Auf dem Rückweg genau umgekehrt: Arme lang, Rumpf nach vorn, dann Knie beugen.\n\nDrag 110–120. Lange, kräftige Züge mit niedriger Schlagzahl sind schneller als viele kurze — 24–28 Züge pro Minute reichen.\n\nTypischer Fehler: Knie beugen, bevor die Hände über die Knie hinweg sind. Dann stößt der Griff an."},"sled_push":{"n":"Sled Push","h":"Tief in den Schlitten legen, Arme lang und gestreckt, Rücken gerade, Blick nach unten. Kleine, schnelle Schritte auf dem Ballen — nicht große Schritte.\n\n90 kg Körpergewicht sind hier ein Vorteil. Der Fehler, der Zeit kostet, ist zu aufrecht stehen: dann drückst du den Schlitten nach unten statt nach vorn.\n\nDurchgehend schieben statt stoßen. Wenn er stehen bleibt, kostet das Anfahren mehr als langsameres Durchgehen."},"sled_pull":{"n":"Sled Pull","h":"Seil greifen, Hüfte tief, Rücken neutral. Ziehen mit Beinen und Latissimus, Arm für Arm im Wechsel, Körper nach hinten gelehnt und die Fersen in den Boden.\n\nACHTUNG RÜCKEN: Das ist für dich die riskanteste Station. Nicht aus der Lendenwirbelsäule reißen und nicht mit rundem Rücken hochziehen. Wenn du merkst, dass der untere Rücken die Arbeit übernimmt: Gewicht runter und Technik üben.\n\nTechnisch die schwierigste Station im Rennen — die ersten Wochen bewusst leicht."},"wall_ball":{"n":"Wall Balls","h":"Ball vor der Brust, tiefe Hocke, aus dem Aufstehen heraus den Ball ans Ziel werfen und beim Fangen direkt in die nächste Hocke gehen.\n\nBei 250 cm Reichhöhe und 305 cm Ziel wirfst du kaum über Kopfhöhe — das ist deine leichteste Station. Der Limiter ist die Hocktiefe, nicht der Wurf.\n\nRhythmus halten und in Serien denken (z.B. 4 × 25 mit kurzen Pausen) statt 100 am Stück und dann einbrechen."},"st_calf":{"n":"Wade an der Wand","h":"Fußballen an die Wand oder eine Bordsteinkante, Ferse am Boden, Bein gestreckt, Hüfte nach vorn schieben. 40 s pro Seite.\n\nDanach dasselbe mit leicht gebeugtem Knie, das erreicht die tiefere Wadenmuskulatur und die Achillessehne. 20 s pro Seite."},"st_ham":{"n":"Oberschenkelrückseite","h":"Ferse auf eine Stufe oder Bank, Bein gestreckt, Zehen hochziehen. Mit geradem Rücken aus der Hüfte nach vorn beugen, bis es zieht. 40 s pro Seite.\n\nAus der Hüfte beugen, nicht den Rücken rund machen — sonst dehnst du deine Baustelle statt den Muskel."},"st_hipflex":{"n":"Hüftbeuger, halb kniend","h":"Ein Knie am Boden, anderes Bein vorn im rechten Winkel. Becken nach vorn schieben und dabei den Po der hinteren Seite anspannen. 45 s pro Seite.\n\nFür dich die wichtigste der fünf: Vollzeitjob im Sitzen plus Laufen macht die Hüftbeuger kurz, und kurze Hüftbeuger ziehen das Becken nach vorn — direkt in deine Rückenprobleme.\n\nNicht ins Hohlkreuz gehen. Rippen unten, Po anspannen, dann kommt die Dehnung von selbst."},"st_quad":{"n":"Oberschenkelvorderseite","h":"Stehend Fuß zum Po ziehen, Knie zeigt nach unten, Becken neutral. An der Wand abstützen. 30 s pro Seite."},"st_glute":{"n":"Gesäß und Piriformis (Figure 4)","h":"Auf dem Rücken, Knöchel über das andere Knie legen, Bein zur Brust ziehen. 40 s pro Seite.\n\nNach langen Läufen und den Lunges das, was am meisten bringt. Wenn du das Gesäß nicht spürst, das Knie weiter nach außen drehen."},"bk_curlup":{"n":"Curl-up (McGill)","h":"Rückenlage, ein Bein angestellt, das andere gestreckt. Hände unter die Lende. Kopf und Schultern nur ein paar Zentimeter anheben, Hals bleibt lang. 8 s halten, 3 Wiederholungen, dann Beine tauschen.\n\nEs sind ausdrücklich keine Sit-ups. Der untere Rücken bleibt neutral, die Bewegung ist minimal — das ist der Punkt."},"bk_sideplank":{"n":"Side Plank","h":"Seitlich auf dem Unterarm, Ellbogen unter der Schulter, Hüfte hoch, Körper eine Linie. 3 × 25–40 s pro Seite.\n\nZu leicht? Oberen Arm zur Decke strecken oder das obere Bein anheben. Zu schwer? Knie am Boden statt Füße."},"bk_birddog":{"n":"Bird Dog","h":"Vierfüßler, gegenüberliegenden Arm und Bein lang ausstrecken, 2 s halten, wechseln. 3 × 8 pro Seite, langsam.\n\nDas Becken darf nicht kippen und nicht rotieren. Lieber kleiner und stabil als weit und wackelig."},"bk_bridge":{"n":"Glute Bridge","h":"Rückenlage, Füße hüftbreit, Becken hochdrücken bis Oberschenkel und Rumpf eine Linie bilden. Oben 2 s halten und das Gesäß bewusst anspannen. 2 × 15.\n\nDie Arbeit soll im Gesäß sein, nicht in der Oberschenkelrückseite oder im unteren Rücken. Wenn es hinten zieht: Füße näher heranstellen."},"bk_hipflex":{"n":"Hüftbeuger-Stretch","h":"Halb kniend, Becken nach vorn, Gesäß der hinteren Seite anspannen. 2 × 45 s pro Seite.\n\nNicht ins Hohlkreuz ausweichen — das ist der häufigste Fehler und macht die Übung wertlos."},"bk_9090":{"n":"90/90 Hüftrotation","h":"Sitzend, beide Knie 90°, ein Bein vor dem Körper, eins seitlich. Kontrolliert von einer Seite zur anderen wechseln, ohne die Hände zu benutzen. 8 Wechsel pro Seite.\n\nMobilität für die Hüftrotation. Kommt dir bei den Lunges und beim Sled Pull zugute."}},"kraftA":[{"id":"wu_a","spec":"8 min","log":false},{"id":"front_squat","spec":"W1 3×10 RPE6 · W2 4×10 · W3 4×8 RPE7–8","log":true},{"id":"split_squat","spec":"3 × 10/Seite · W1 Körpergewicht · W2 2×10–12 kg · W3 2×12–14 kg","log":true},{"id":"rdl","spec":"3 × 10 leicht · Form vor Gewicht","log":true},{"id":"thruster","spec":"W1 3×12 · W2 3×15 · W3 4×15, leicht","log":true},{"id":"ohp","spec":"3 × 10–12","log":true},{"id":"stepup","spec":"3 × 12/Seite","log":true},{"id":"core_a","spec":"Dead Bug 3 × 10/Seite + Side Plank 3 × 35 s/Seite","log":false}],"kraftB":[{"id":"wu_b","spec":"8 min","log":false},{"id":"prone_row","spec":"4 × 12 · Brust am Boden, Rücken unbelastet","log":true},{"id":"db_row","spec":"5 × 10/Seite · 2 s ablassen","log":true},{"id":"high_pull","spec":"4 × 10 · ersetzt vertikales Ziehen","log":true},{"id":"pullover","spec":"3 × 12 · Ski-Zugmuster","log":true},{"id":"farmers_hold","spec":"W1 4×40 s @2×15 kg · W2 4×50 s @2×20 kg · W3 4×60 s · ersetzt Farmers Carry","log":true},{"id":"suitcase_hold","spec":"3 × 30 s/Seite · ersetzt Suitcase Carry","log":true},{"id":"hang_clean","spec":"4 × 8/Seite","log":true},{"id":"core_b","spec":"Hollow 3 × 30 s + Bird Dog 3 × 8/Seite","log":false},{"id":"finisher_b","spec":"3 Runden","log":false}],"profile":"Du bist mein Hyrox-Coach. Kontext zu mir:\n- Wettkampf: Hyrox Single, Open Division, 01.11.2026. Zielzeit 1:15 — nach der Neukalibrierung realistisch erreichbar, erwartet 1:16-1:22. Neuer Engpass sind die Stationen, nicht mehr das Laufen (Ski, Row, Sled erst ab 01.09. verfügbar).\n- 193 cm, 90 kg, männlich. Laufumfang steigt in Block 1 von 20 auf 40 km/Woche.\n- Formstand: 3×6 min Threshold am 12.08. bei 4:38 / 4:40 / 4:13 gelaufen, Anstrengung 7-8. Daraus VDOT 45,9, geschätzte 5 km 21:27. Die ursprüngliche Selbstauskunft (5 km 22:30) war zu konservativ, die Zonen wurden am 13.08. um rund 13 s/km angehoben. Ein 3-km-Zeitfahren am 19.08. soll das bestäti const mmss=sec=>{sec=Math.round(sec);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`};
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?null:x};

/* Zeitangaben tolerant lesen. Auf dem iPhone gibt die Zifferntastatur kein „:“ her,
   deshalb wird eine reine Ziffernfolge nach Länge interpretiert:
   3 Ziffern → m:ss (440 → 4:40) · 4 Ziffern → mm:ss (1225 → 12:25)
   5–6 Ziffern → h:mm:ss. Trennzeichen : . , werden alle akzeptiert.        */
function parseTime(str){
  if(str==null)return null;
  let t=String(str).trim();
  if(!t)return null;
  if(/[:.,]/.test(t)){
    const p=t.split(/[:.,]/).map(x=>parseInt(x,10));
    if(p.some(isNaN))return null;
    if(p.length===2)return p[1]>59?null:p[0]*60+p[1];
    if(p.length>=3)return (p[1]>59||p[2]>59)?null:p[0]*3600+p[1]*60+p[2];
    return p[0]*60;
  }
  if(!/^\d+$/.test(t))return null;
  if(t.length<=2)return parseInt(t,10)*60;                         // "5" → 5:00
  const sec=+t.slice(-2);
  if(sec>59)return null;                                           // "465" ist keine Zeit
  if(t.length===3)return +t[0]*60 + sec;                            // "440" → 4:40
  if(t.length===4)return +t.slice(0,2)*60 + sec;                    // "1225" → 12:25
  if(t.length<=6){const m=+t.slice(-4,-2); if(m>59)return null;
    return +t.slice(0,-4)*3600 + m*60 + sec}
  return null;
}
/* Pace zusätzlich auf Plausibilität prüfen: 2:00–9:59 pro km. */
function parsePace(str){ const v=parseTime(str); return (v&&v>=120&&v<=599)?v:null }
function paceEcho(v){
  if(!v)return '';
  const p=parsePace(v);
  return p ? `verstanden als <b>${mmss(p)} /km</b>`
           : `<span class="bad">nicht erkannt — versuch 440 oder 4:40</span>`;
}
function timeEcho(v){
  if(!v)return '';
  const t=parseTime(v);
  return t&&t>60 ? `verstanden als <b>${mmss(t)}</b>`
                 : `<span class="bad">nicht erkannt — versuch 1225 oder 12:25</span>`;
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2400)}

/* ═══════════ Physiologie (Daniels/Gilbert) ═══════════
   Alle Zonen leiten sich aus einem einzigen VDOT-Wert ab. Das Modell ist gegen
   die Startpaces des Plans verifiziert: 5 km 22:30 → VDOT 43,4 → Threshold 4:52. */
const vo2  = v => -4.60 + 0.182258*v + 0.000104*v*v;         // v in m/min
const pctV = t => 0.8 + 0.1894393*Math.exp(-0.012778*t) + 0.2989558*Math.exp(-0.1932605*t);
const vdotRace = (m,sec) => { const t=sec/60; return vo2(m/t)/pctV(t) };
const vFromVO2 = x => { const a=0.000104,b=0.182258,c=-4.60-x;
  return (-b+Math.sqrt(b*b-4*a*c))/(2*a) };
const paceOf = (vdot,frac) => 60000/vFromVO2(frac*vdot);     // Sekunden pro km
function raceTime(vdot,m){ let lo=1,hi=400;
  for(let i=0;i<70;i++){const t=(lo+hi)/2; if(vo2(m/t)/pctV(t)>vdot) lo=t; else hi=t}
  return (lo+hi)/2*60 }
/* Zonen als Anteil von VDOT. E/L bewusst etwas langsamer als das Modell —
   Grundlagenläufe sollen wirklich locker sein. */
const FRAC={E:[.655,.685],L:[.665,.695],M:[.79,.815],T:[.85,.868],I:[.965,.995],R:[1.04,1.08]};
const ZLBL={E:'Easy / Recovery',L:'Long Run',M:'Steady',T:'Threshold',I:'Intervall',R:'Rep'};
const ZTGT={T:7,I:8,R:8};                                     // erwartete Anstrengung
const EVZ=['T','I','R'];                                      // nur diese liefern Evidenz
const zoneBand=(vdot,z)=>FRAC[z].map(f=>paceOf(vdot,f)).sort((a,b)=>a-b);  // schnell → langsam

/* ═══════════ Formanalyse ═══════════ */
/* Basis nicht mehr die Selbstauskunft, sondern die gemessene Threshold-Leistung
   vom 12.08.: 3×6 min, wiederholbare Pace 4:39/km → VDOT 45.9 → 5 km ≈ 21:27.
   Ein echtes Zeitfahren im Tab „Form“ überschreibt das jederzeit. */
const BASE_VDOT=45.9;
const BASE_TT={m:5000,sec:null,vdot:BASE_VDOT,
  label:'3×6 min @ 4:39 am 12.08. (VDOT 45,9 · 5 km ≈ 21:27)'};

function anchor(){
  const tts=S.tt.filter(t=>t.m>0&&t.sec>0).sort((a,b)=>a.date<b.date?-1:1);
  if(tts.length){const l=tts[tts.length-1];
    return {vdot:vdotRace(l.m,l.sec), date:l.date,
      label:`${(l.m/1000).toFixed(l.m%1000?1:0)} km in ${mmss(l.sec)} am ${fmt(l.date)}`, measured:true}}
  return {vdot:BASE_TT.vdot, date:'2026-08-12', label:BASE_TT.label, measured:false};
}

function evidence(){
  const a=anchor();
  return D.sessions.filter(s=>EVZ.includes(s.zone))
    .filter(s=>parse(s.date)>=parse(a.date) && S.done[s.date])
    .map(s=>{
      const l=S.log[s.date]||{}, p=parsePace(l.pace), rpe=num(l.rpe);
      if(!p) return null;
      const implied=vo2(60000/p)/((FRAC[s.zone][0]+FRAC[s.zone][1])/2);
      const corr = isNaN(rpe) ? 0 : Math.max(-3, Math.min(1, ZTGT[s.zone]-rpe));
      const tgtBand=(s.tgt||'').split('-').map(x=>parseTime(x)).filter(Boolean);
      return {s, pace:p, rpe:isNaN(rpe)?null:rpe, implied, corr, vdot:implied+corr,
              tgt:tgtBand.length?tgtBand:null, delta:implied+corr-a.vdot};
    }).filter(Boolean);
}

/* Regeln, bewusst konservativ:
   – nur Qualitätseinheiten mit eingetragener Pace zählen
   – es braucht die letzten ZWEI, und sie müssen in dieselbe Richtung zeigen
   – Abweichung unter 0.8 VDOT gilt als Rauschen
   – die Anpassung wird halbiert und bei 1.5 VDOT je Schritt gedeckelt
   – Gesamtabstand zum Anker nie über 4 VDOT
   – ein Zeitfahren ersetzt die Regel und setzt den Anker direkt neu           */
function adapt(){
  const a=anchor(), ev=evidence();
  const r={anchor:a, ev, vdot:a.vdot, shift:0, status:'', why:''};
  if(!S.adapt){ r.status='aus'; r.why='Automatische Anpassung ist ausgeschaltet.'; return r }
  if(ev.length<2){ r.status='wartet';
    r.why=`Es braucht zwei Qualitätseinheiten mit eingetragener Pace. Vorhanden: ${ev.length}.`;
    return r }
  const last=ev.slice(-2), d=last.map(e=>e.delta), mean=(d[0]+d[1])/2;
  if(Math.sign(d[0])!==Math.sign(d[1])){ r.status='widersprüchlich';
    r.why='Die letzten zwei Qualitätseinheiten zeigen in verschiedene Richtungen — abwarten.';
    return r }
  if(Math.abs(mean)<0.8){ r.status='stabil';
    r.why='Abweichung unter 0,8 VDOT — das ist Tagesform, keine Formänderung.'; return r }
  const step=Math.sign(mean)*Math.min(Math.abs(mean)*0.5,1.5);
  r.shift=Math.max(-4,Math.min(4,step));
  r.vdot=a.vdot+r.shift;
  r.status = r.shift>0 ? 'schneller' : 'langsamer';
  r.why = r.shift>0
    ? `Zwei Qualitätseinheiten deutlich über Plan, bei passender Anstrengung. Zonen um ${Math.abs(r.shift).toFixed(1)} VDOT angehoben — gedämpft, nicht die volle Abweichung.`
    : `Zwei Qualitätseinheiten unter Plan oder bei zu hoher Anstrengung. Zonen um ${Math.abs(r.shift).toFixed(1)} VDOT gesenkt.`;
  return r;
}
const curVdot=()=>adapt().vdot;

/* ═══════════ Notizen: Stichwortsignale ═══════════
   Bewusst keine Deutung, nur eine Suche. Was hier auftaucht, gehört in den
   Claude-Knopf oder ins Gespräch — die Automatik rechnet ausschließlich mit
   Pace, RPE, km und Rücken-Score. */
const FLAGS=[
  {k:['schmerz','sticht','stechen','ziept','zieht ins bein','taub','kribbel','kribbeln'],
   l:'Schmerz oder Nerv', sev:2},
  {k:['abgebrochen','abbruch','aufgehört','aufgegeben','geschafft nicht','nicht geschafft',
      'eingebrochen','weggebrochen'], l:'Einheit nicht durchgezogen', sev:2},
  {k:['knie','achilles','schienbein','waden','hüfte','rücken','ferse','fuß'],
   l:'Körperstelle genannt', sev:1},
  {k:['müde','erschöpft','platt','kaputt','schlecht geschlafen','kein schlaf','krank',
      'erkältet','schwindel'], l:'Ermüdung oder Krankheit', sev:1},
  {k:['zu leicht','locker','easy','ging gut','stark','überrascht'],
   l:'War leichter als geplant', sev:0},
  {k:['zu schwer','zu schnell','viel zu hart','überfordert'], l:'War zu schwer', sev:1},
];
function signals(){
  const out=[];
  for(const s of D.sessions){
    const n=(S.log[s.date]||{}).note; if(!n)continue;
    const low=n.toLowerCase();
    for(const f of FLAGS){
      const hit=f.k.find(k=>low.includes(k));
      if(hit)out.push({date:s.date,title:s.title,label:f.l,sev:f.sev,word:hit,note:n});
    }
  }
  return out.sort((a,b)=>b.sev-a.sev || (a.date<b.date?1:-1));
}

/* ═══════════ Claude-Anbindung ═══════════ */
function zoneLines(vdot){
  return Object.keys(FRAC).map(z=>{const b=zoneBand(vdot,z);
    return `${ZLBL[z]}: ${mmss(b[0])}–${mmss(b[1])} /km`});
}
function promptFor(s){

    s.title+' — '+s.meta,

    ...(s.note?['Hinweis vom Coach: '+s.note]:[]),
    ...(bits.length?['','Mein Log dazu: '+bits.join(' · ')]:[]),
    '',
    'Ich will diese Einheit anpassen. Frag mich in einem Satz, wo das Problem liegt '
    +'(Zeit, Equipment, Rücken, Müdigkeit, Motivation), und schlag dann eine konkrete '
    +'Alternative vor, die den Trainingsreiz möglichst erhält. Berücksichtige, was in '
    +'dieser Woche sonst noch ansteht.'

}
function blockPrompt(){
  const a=adapt();
  return [D.profile,'','FORMANALYSE DER APP:',
    `- Basis: ${a.anchor.label}`,
    `- VDOT jetzt: ${a.vdot.toFixed(1)} (${a.status}${a.shift?`, ${a.shift>0?'+':''}${a.shift.toFixed(1)}`:''})`,

    `- Geschätzte 5-km-Zeit: ${mmss(raceTime(a.vdot,5000))}`,
    '- Zonen jetzt: '+zoneLines(a.vdot).join(' · '),
    ...(a.ev.length?['','Evidenz aus Qualitätseinheiten:',
      ...a.ev.map(e=>`- ${e.s.date} ${e.s.title}: Ziel ${e.s.tgt}, gelaufen ${mmss(e.pace)}`
        +`${e.rpe?`, RPE ${e.rpe}`:''} → impliziter VDOT ${e.vdot.toFixed(1)}`)]:[]),
    '','MEIN LOG AUS BLOCK 1:','',report(),'',
    ...(signals().length?['','SIGNALE AUS MEINEN NOTIZEN (Stichwortsuche der App, ungedeutet):',
      ...signals().slice(0,12).map(x=>`- ${x.date} [${x.label}] „${x.note.replace(/\n/g,' ')}“`)]:[]),

const claudeUrl = t => 'https://claude.ai/new?q='+encodeURIComponent(t);

/* ═══════════ Kopfzeile ═══════════ */
function head(){
  const days=Math.round((parse(D.race)-parse(TODAY))/864e5);
  document.getElementById('cd').textContent =
    days>0 ? `${days} Tage bis 01.11. · ${D.goal}` : 'Renntag!';
  const done=TRAIN.filter(s=>S.done[s.date]).length;
  const km=D.sessions.reduce((a,s)=>a+(S.done[s.date]?(num((S.log[s.date]||{}).km)||s.km):0),0);
  const pct=Math.round(done/TRAIN.length*100);
  const b=document.getElementById('pgbar');
  b.firstElementChild.style.width=pct+'%'; b.setAttribute('aria-valuenow',pct);
  document.getElementById('pgl').textContent=`${done}/${TRAIN.length} Einheiten`;
  document.getElementById('kml').textContent=`${Math.round(km)} / ${PLANKM} km · VDOT ${curVdot().toFixed(1)}`;
}

    tgtNow=`<div class="sub" style="margin-top:8px">Zielpace nach aktueller Form:
      <b style="font-family:var(--mono)" id="zl-${s.date}">${mmss(b[0])}–${mmss(b[1])} /km</b>

    <div class="dt">${fmt(s.date)}${s.date===TODAY?' · heute':''}${s.date<TODAY?' · nachtragen':''}</div>

    <div class="meta"><span class="tag ${c}">${l}</span> ${esc(s.meta)}</div>
    ${tgtNow}
    ${steps?`<ul class="steps">${steps}</ul>`:''}
    ${exBlock}
    ${s.note?`<div class="card warn" style="margin:14px 0 0"><div class="ct">Worauf es ankommt</div><div class="sub">${esc(s.note)}</div></div>`:''}
    <button class="big" data-toggle="${s.date}" aria-pressed="${done}">
      ${done?'✓ Erledigt':'Als erledigt markieren'}</button>
    <div class="fields">
      ${isStr?'':`<div class="f"><label for="km-${s.date}">Tatsächliche km</label>
        <input id="km-${s.date}" type="text" inputmode="decimal" autocomplete="off"
          placeholder="${s.km||0}" value="${esc(lg.km??'')}" data-log="km" data-d="${s.date}"></div>`}
      <div class="f ${isStr?'':''}"><label for="rpe-${s.date}">Anstrengung 1–10</label>
        <input id="rpe-${s.date}" type="text" inputmode="numeric" autocomplete="off"
          placeholder="–" value="${esc(lg.rpe??'')}" data-log="rpe" data-d="${s.date}"></div>
      ${isStr?`<div class="f"><label for="dur-${s.date}">Dauer in min</label>
        <input id="dur-${s.date}" type="text" inputmode="numeric" autocomplete="off"
          placeholder="–" value="${esc(lg.dur??'')}" data-log="dur" data-d="${s.date}"></div>`:''}
      ${isRun?`<div class="f full"><label for="pc-${s.date}">Ist-Pace pro km
        <span class="hint">${EVZ.includes(s.zone)?'— Schnitt der Arbeitsintervalle. Steuert die Formanalyse.':'— Schnitt des Laufs, optional.'}
        Tippe <b>440</b> oder <b>4:40</b>.</span></label>
        <input id="pc-${s.date}" type="text" inputmode="decimal" autocomplete="off"
          placeholder="440  oder  4:40" value="${esc(lg.pace||'')}"
          data-log="pace" data-d="${s.date}" aria-describedby="pe-${s.date}">
        <span class="echo" id="pe-${s.date}">${paceEcho(lg.pace)}</span></div>`:''}

        <div class="seg" role="group" aria-labelledby="bl-${s.date}">
          ${BACKLBL.map((t,i)=>`<button data-back="${i}" data-d="${s.date}" aria-pressed="${lg.back==i}">${t}</button>`).join('')}

let cur = DATES.includes(TODAY) ? TODAY
        : (parse(TODAY)<parse(FIRST) ? FIRST : LAST);

function vDay(){
  const i=DATES.indexOf(cur), s=byDate[cur];
  const nav=`<div class="daynav">
    <button data-step="-1" ${i<=0?'disabled':''} aria-label="Vorheriger Tag">‹</button>
    <div class="mid"><b>${fmt(cur)}</b><span>Tag ${i+1} von ${DATES.length}${cur===TODAY?' · heute':''}</span></div>
    <button data-step="1" ${i>=DATES.length-1?'disabled':''} aria-label="Nächster Tag">›</button>
    ${cur!==TODAY&&DATES.includes(TODAY)?'<button class="today" data-goto="'+TODAY+'">Heute</button>':''}
  </div>`;
  let html=nav+sessionCard(s);
  if(cur===TODAY||true){
    const on=!!S.back[cur];
    let streak=0; for(let k=0;;k++){const d=parse(cur);d.setDate(d.getDate()-k);
      if(S.back[iso(d)])streak++; else break}
    const dots=DATES.map(x=>`<span class="${S.back[x]?'on':''} ${x===cur?'tdy':''}"></span>`).join('');
    html+=`<article class="card ${on?'ok':'warn'}">
      <div class="ct">Rückenroutine — 8 min</div>
      <div class="sub">Nicht optional. Sandbag Lunges und Sled Pull sind deine riskantesten Stationen.${streak>1?` <b>${streak} Tage in Folge.</b>`:''}</div>
      <div class="exlist">${D.back.map((e,i)=>exRow(e,'back'+cur,i)).join('')}</div>
      <button class="big ${on?'':'ghost'}" data-backday="${cur}" aria-pressed="${on}">${on?'✓ Gemacht':'Für diesen Tag abhaken'}</button>
      <div class="dots" aria-hidden="true">${dots}</div>
      <div class="sub" style="margin-top:12px;color:var(--hot)"><b>Abbruchkriterien:</b> Schmerz der ins Bein zieht, Taubheit/Kribbeln, oder Morgensteifigkeit über 30 min → Einheit streichen und ärztlich abklären.</div>
    </article>`;
  }
  return html;
}

    `VDOT jetzt ${a.vdot.toFixed(1)} · 5-km-Prognose ${mmss(raceTime(a.vdot,5000))}`,''];
  for(const[n,w] of Object.entries(D.weeks)){
    const ss=D.sessions.filter(s=>s.w==n), tr=ss.filter(s=>s.type!=='rest');
    const km=ss.reduce((x,s)=>x+(S.done[s.date]?(num((S.log[s.date]||{}).km)||s.km):0),0);
    o.push(`## ${w.label} — ${tr.filter(s=>S.done[s.date]).length}/${tr.length} Einheiten, ${Math.round(km)} von ${w.km} km`);
    ss.filter(s=>s.type!=='rest'||S.log[s.date]?.note).forEach(s=>{const l=S.log[s.date]||{};
      const bits=[S.done[s.date]?'erledigt':'offen'];
      if(l.km)bits.push(l.km+' km'); if(l.pace)bits.push(l.pace+' /km'); if(l.rpe)bits.push('RPE '+l.rpe);
      if(l.dur)bits.push(l.dur+' min');
      if(l.w)Object.entries(l.w).filter(([,v])=>v).forEach(([k,v])=>
        bits.push((D.exlib[k]?D.exlib[k].n:k)+' '+v+' kg'));
      if(l.back!=null&&l.back!=='')bits.push('Rücken: '+BACKLBL[l.back]);
      o.push(`- ${s.date} ${s.title}${s.tgt?` (Ziel ${s.tgt})`:''} — ${bits.join(', ')}`);
      if(l.note)o.push(`    ${l.note.replace(/\n/g,'\n    ')}`)});
    o.push('');
  }
  const bk=DATES.filter(d=>parse(d)<=parse(TODAY));
  o.push(`Rückenroutine: ${bk.filter(d=>S.back[d]).length}/${bk.length} Tage`);
  if(S.tt.length)o.push('Zeitfahren: '+S.tt.map(t=>`${t.m/1000} km ${mmss(t.sec)} (${t.date})`).join(', '));
  return o.join('\n');
}

/* ═══════════ Rendern ═══════════ */
let tab='day';
const VIEWS={day:vDay,plan:vPlan,ref:vRef,log:vLog};
function render(keep){
  const y=keep?window.scrollY:0;
  document.getElementById('view').innerHTML=VIEWS[tab]();
  const blk=document.getElementById('blk'); if(blk)blk.href=claudeUrl(blockPrompt());
  head(); window.scrollTo(0,keep?y:0);
}
function setTab(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  render();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  setTab(b.dataset.tab);
  document.getElementById('live').textContent=b.textContent.trim()+' geöffnet';
});

/* ═══════════ Interaktion ═══════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toggle],[data-back],[data-backday],[data-open],[data-cp],'
    +'[data-step],[data-goto],[data-adapt],[data-deltt],#addtt,#exp,#cpy,#rst');
  if(!t)return;
  if(t.hasAttribute('data-toggle')){
    const d=t.dataset.toggle; S.done[d]=!S.done[d]; if(!S.done[d])delete S.done[d];
    save(); render(true); toast(S.done[d]?'Erledigt ✓':'Wieder offen');
  } else if(t.hasAttribute('data-back')){
    const d=t.dataset.d; (S.log[d]=S.log[d]||{}).back=+t.dataset.back; save(); render(true);
  } else if(t.hasAttribute('data-backday')){
    const d=t.dataset.backday; S.back[d]=!S.back[d]; if(!S.back[d])delete S.back[d];
    save(); render(true); toast(S.back[d]?'Rücken erledigt ✓':'Wieder offen');
  } else if(t.hasAttribute('data-open')){
    cur=t.dataset.open; setTab('day');
    document.getElementById('live').textContent=fmt(cur)+' geöffnet';
  } else if(t.hasAttribute('data-step')){
    const i=DATES.indexOf(cur)+ +t.dataset.step;
    if(i>=0&&i<DATES.length){cur=DATES[i]; render()}
  } else if(t.hasAttribute('data-goto')){
    cur=t.dataset.goto; render();
  } else if(t.hasAttribute('data-adapt')){
    S.adapt=!S.adapt; save(); render(true);
    toast(S.adapt?'Automatische Anpassung an':'Automatische Anpassung aus');
  } else if(t.hasAttribute('data-deltt')){
    S.tt.splice(+t.dataset.deltt,1); save(); render(true); toast('Zeitfahren gelöscht');
  } else if(t.id==='addtt'){
    const m=+document.getElementById('ttd').value;
    const sec=parseTime(document.getElementById('ttt').value);
    const date=document.getElementById('ttdate').value||TODAY;
    if(!sec){toast('Zeit bitte als mm:ss eingeben, z.B. 21:40');return}
    const v=vdotRace(m,sec);
    if(v<25||v>85){toast('Das ergibt VDOT '+v.toFixed(0)+' — bitte Distanz und Zeit prüfen');return}
    S.tt.push({m,sec,date}); S.tt.sort((a,b)=>a.date<b.date?-1:1); save(); render();
    toast(`Basis neu gesetzt: VDOT ${v.toFixed(1)}, Threshold ${mmss(zoneBand(v,'T')[0])}–${mmss(zoneBand(v,'T')[1])}`);
  } else if(t.hasAttribute('data-cp')){
    navigator.clipboard?.writeText(promptFor(byDate[t.dataset.cp])).then(
      ()=>toast('Prompt kopiert — in Claude einfügen'),()=>toast('Kopieren nicht möglich'));
  } else if(t.id==='exp'){
    const txt=report();
    if(navigator.share)navigator.share({title:'Hyrox Block 1',text:txt}).catch(()=>{});
    else{navigator.clipboard?.writeText(txt);toast('Kopiert')}
  } else if(t.id==='cpy'){
    navigator.clipboard?.writeText(report()).then(()=>toast('In die Zwischenablage kopiert'),
      ()=>toast('Kopieren nicht möglich'));
  } else if(t.id==='rst'){
    if(confirm('Wirklich alle Häkchen, Zahlen und Notizen löschen?')){
      S={done:{},log:{},back:{},tt:[],adapt:true,fs:S.fs,th:S.th}; save(); render(); toast('Zurückgesetzt')}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.w!==undefined){
    const d=t.dataset.d, L=(S.log[d]=S.log[d]||{});
    (L.w=L.w||{})[t.dataset.w]=t.value; save(); return }
  if(t.id==='ttt'){ const el=document.getElementById('tte');
    if(el)el.innerHTML=timeEcho(t.value); return }
  if(!t.dataset.log)return;
  const d=t.dataset.d; (S.log[d]=S.log[d]||{})[t.dataset.log]=t.value; save();
  if(t.dataset.log==='pace'){
    const el=document.getElementById('pe-'+d); if(el)el.innerHTML=paceEcho(t.value);
    const zl=document.getElementById('zl-'+d);
    if(zl){const b=zoneBand(curVdot(),byDate[d].zone);
      zl.innerHTML=`${mmss(b[0])}–${mmss(b[1])} /km`}
  }
  head();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.log==='pace'&&tab==='day'){ head() }
});

/* ═══════════ Einstellungen ═══════════ */
const FS=[.94,1,1.12,1.26];
const applyFs=()=>document.documentElement.style.setProperty('--fs',FS[S.fs]+'rem');
document.getElementById('fsBtn').onclick=()=>{S.fs=(S.fs+1)%FS.length;save();applyFs();
  document.getElementById('live').textContent='Schriftgröße '+(S.fs+1)+' von '+FS.length};
document.getElementById('thBtn').onclick=()=>{
  S.th=S.th==='auto'?'light':S.th==='light'?'dark':'auto'; save();
  document.documentElement.dataset.th=S.th==='auto'?'':S.th;
  toast(S.th==='auto'?'Systemeinstellung':S.th==='light'?'Hell':'Dunkel')};
applyFs(); if(S.th!=='auto')document.documentElement.dataset.th=S.th;
render();

if('serviceWorker' in navigator) addEventListener('load',()=>
  navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
